# CD: after CI passes on main → migrate the hosted DB → deploy to Vercel production → smoke test
# → publish the Docker image to GHCR. Preview deployments for PRs come from Vercel's Git integration.
#
# Repo secrets (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID   (from `npx vercel link` → .vercel/project.json)
#   DIRECT_URL     Supabase SESSION POOLER string (…pooler.supabase.com:5432) — migrations only.
#                  Not the "Direct connection" host: it is IPv6-only and GitHub runners are IPv4.
# Repo variable (… → Variables):
#   PRODUCTION_URL e.g. https://my-app.vercel.app — the smoke test hits this public domain, because
#                  per-deployment URLs sit behind Vercel Deployment Protection (401).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a running migration

jobs:
  production:
    # Only a successful CI run for a *push* to main in THIS repo (not a fork PR from a branch named
    # "main"), or a manual run on main, may touch production secrets.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          missing=""
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DIRECT_URL PRODUCTION_URL; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::Missing secrets/variables:$missing (see header of deploy.yml)"; exit 1; }
      - run: npm ci
      - name: Migrate database (TypeORM + Better Auth)
        env:
          DATABASE_URL: ${{ secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_SSL: "true"
          BETTER_AUTH_SECRET: migration-only-placeholder-secret-0000
        run: |
          npm run db:migrate
          npx auth migrate --yes
      - name: Build and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.PRODUCTION_URL }}/api/health"

  image:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
