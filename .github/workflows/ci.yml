name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CI: "true"
      # Values mirror .env.test (committed, no secrets)
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      DB_SYNC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Migrations match entities
        # Once the first migration exists, a fresh DB + all migrations must equal the entities.
        # Fails the PR if someone changed an entity without `npm run db:generate`.
        run: |
          if ls src/db/migrations/*.ts >/dev/null 2>&1; then
            DB_SYNC=false npm run db:migrate
            DB_SYNC=false npm run typeorm -- migration:generate src/db/migrations/Drift -d src/db/cli-data-source.ts --check
          else
            echo "No migrations yet (dev uses DB_SYNC). Generate one before the first deploy."
          fi
      - run: npm run test:integration
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (builds and starts the app)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    # Proves the production image still builds (no push here — see deploy.yml).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
